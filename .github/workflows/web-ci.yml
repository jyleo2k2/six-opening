name: web-ci

# web 의 테스트와 빌드를 PR 마다 돌린다. 지금까지 CI 는 세션 정책만 검사해서
# 코드가 빌드되는지조차 확인하지 않았다.
#
# 비밀키 없이 통과해야 한다. 빌드가 환경변수를 요구하기 시작하면 CI 가 먼저 잡는다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      # F10 라우팅 회귀. 단위 테스트는 개별 함수를 보고, 이쪽은 오케스트레이터
      # 전 구간과 기존 600건 라우트 분포를 함께 본다. 트리거를 넓히는 작업의
      # 위험은 과차단이 아니라 과소차단이라 차단 하한도 여기서 막는다.
      - name: F10 chat regression
        run: npx tsx ../records/f10-child-sim/run-regression.ts --legacy --max-fail 0
      - name: Build
        run: npm run build
