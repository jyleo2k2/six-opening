name: session-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate session manager
        run: node --test scripts/git-session-manager.test.mjs
      - name: Validate PR policy
        run: node scripts/git-session-manager.mjs check-pr --event "$GITHUB_EVENT_PATH"
      - name: Validate guard pairs
        run: node scripts/git-session-manager.mjs check-guards
      - name: Validate whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
