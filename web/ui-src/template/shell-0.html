<style>
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-Medium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-SemiBold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-ExtraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-Black.otf') format('opentype');font-weight:900;font-display:swap}
body{margin:0;background:#E9E9F0;font-family:'Pretendard','Segoe UI','Malgun Gothic',sans-serif;color:#1A2233;-webkit-font-smoothing:antialiased}
a{color:#F5327F;text-decoration:none}
a:hover{color:#01185A}
::-webkit-scrollbar{width:0;height:0}
html.runtime body{background:#F6F7FA;overflow:hidden}
html.runtime x-dc>div,html.runtime .sc-host>div{padding:0!important;display:flex!important;justify-content:center!important;align-items:center!important;flex-wrap:nowrap!important;height:100dvh!important}
html.runtime x-dc>div>div:first-child,html.runtime .sc-host>div>div:first-child{transform:scale(var(--runtime-scale,.9));transform-origin:center center}
html.runtime x-dc>div>div:nth-child(2),html.runtime .sc-host>div>div:nth-child(2){display:none!important}
@keyframes popItem{0%{opacity:0;transform:translateY(0) scale(0.3)}20%{opacity:1;transform:translateY(-14px) scale(1.05)}80%{opacity:1;transform:translateY(-55px) scale(1)}100%{opacity:0;transform:translateY(-115px) scale(0.85)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
<script>
if(new URLSearchParams(location.search).get('runtime')==='1'){
  const fitRuntime=()=>document.documentElement.style.setProperty('--runtime-scale',String(Math.min(1,(innerWidth-8)/450,(innerHeight-8)/920)));
  document.documentElement.classList.add('runtime');fitRuntime();addEventListener('resize',fitRuntime);
}
</script>
