<sc-if value="{{ isRanking }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column">

<div style="{{ rkHeadStyle }}">
<div onClick="{{ goHome }}" style="{{ rkBackStyle }}">‹</div>
<div style="{{ rkTitleStyle }}"><span>랭킹</span></div>
<div style="{{ rkSegWrap }}">
<div onClick="{{ pickWeek }}" style="{{ rkSegWeek }}">이번 주</div>
<div onClick="{{ pickSeason }}" style="{{ rkSegSeason }}">시즌 전체</div>
</div>
<div style="{{ rkConeStyle }}"></div>
<div style="{{ rkGroundStyle }}"></div>
<sc-for list="{{ podium }}" as="p" hint-placeholder-count="3">
<div style="{{ p.pedStyle }}">
<div style="{{ p.pedTopStyle }}"></div>
<div style="{{ p.ribLStyle }}"></div>
<div style="{{ p.ribRStyle }}"></div>
<div style="{{ p.medStyle }}">{{ p.rank }}</div>
</div>
</sc-for>
<sc-for list="{{ podium }}" as="p" hint-placeholder-count="3">
<div style="{{ p.slotStyle }}">
<div style="{{ p.crownStyle }}">{{ p.crown }}</div>
<div style="{{ p.nameStyle }}">{{ p.name }}</div>
<div style="{{ p.pillStyle }}">
<div style="{{ p.pctStyle }}">{{ p.pct }}</div>
<div style="{{ p.stepStyle }}">{{ p.step }}</div>
</div>
<div style="{{ p.avStyle }}">{{ p.emoji }}</div>
</div>
</sc-for>
</div>

<div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 16px 4px;display:flex;flex-direction:column;gap:13px">
<sc-for list="{{ rankRows }}" as="r" hint-placeholder-count="13">
<div style="{{ r.rowStyle }}">
<div style="{{ r.rankStyle }}">{{ r.rank }}</div>
<div style="{{ r.plateStyle }}">{{ r.emoji }}</div>
<div style="{{ r.nameStyle }}">{{ r.name }}</div>
<div style="{{ r.badgeStyle }}">{{ r.step }}</div>
<div style="{{ r.pctStyle }}">{{ r.pct }}</div>
</div>
</sc-for>
</div>

<div style="{{ navBarStyle }}">
<div style="{{ navPillStyle }}">
<div onClick="{{ goHome }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
<svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ navHomeIcon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path></svg>
<span style="{{ navHomeLabel }}">홈</span>
</div>
<div id="tut-nav-trade" onClick="{{ goExplore }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
<svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ navTradeIcon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"></path><circle cx="20" cy="7" r="1.5" fill="{{ navTradeIcon }}" stroke="none"></circle></svg>
<span style="{{ navTradeLabel }}">모의투자</span>
</div>
<div onClick="{{ goArchive }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
<svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ navArchiveIcon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="15" width="16" height="3" rx="1"></rect><rect x="5" y="11" width="14" height="3" rx="1"></rect><rect x="6" y="7" width="12" height="3" rx="1"></rect></svg>
<span style="{{ navArchiveLabel }}">아카이브</span>
</div>
<div onClick="{{ goRanking }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
<svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ navRankingIcon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"></path><path d="M8 5H5a3 3 0 0 0 3 5"></path><path d="M16 5h3a3 3 0 0 1-3 5"></path><path d="M12 13v3"></path><path d="M9 20h6"></path><path d="M9 20a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"></path></svg>
<span style="{{ navRankingLabel }}">랭킹</span>
</div>
</div>
</div>
</div>
</sc-if>
