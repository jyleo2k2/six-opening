<sc-if value="{{ isChart }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;padding-top:59px;display:flex;flex-direction:column">
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:6px 18px 10px">
<div onClick="{{ closeSub }}" style="{{ backBtnStyle }}">‹</div>
<div style="flex:1;text-align:center;font-size:19px;font-weight:800;color:#01185A;letter-spacing:-0.01em">{{ stockName }} 차트</div>
<div style="width:38px"></div>
</div>
<div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 16px 0;display:flex;flex-direction:column;gap:12px">

<div style="background:#FFFFFF;border-radius:28px;padding:18px;box-shadow:0 2px 10px rgba(30,25,60,0.05)">
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="font-size:13px;font-weight:500;color:#8E93A8">지금 가격</div><div style="font-size:27px;font-weight:800;color:#01185A;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;white-space:nowrap">{{ stockPriceText }}</div></div>
<span style="{{ detailChangeStyle }}">{{ stockChangeText }}</span>
</div>
<div style="display:flex;gap:7px;margin-top:15px">
<div onClick="{{ chartLine }}" style="{{ chartLineStyle }}">선차트</div>
<div onClick="{{ chartCandle }}" style="{{ chartCandleStyle }}">캔들차트</div>
</div>
<div style="display:flex;gap:7px;margin-top:9px">
<div onClick="{{ tfMinute }}" style="{{ tfMinuteStyle }}">분봉</div>
<div onClick="{{ tfDaily }}" style="{{ tfDailyStyle }}">일봉</div>
<div onClick="{{ tfWeekly }}" style="{{ tfWeeklyStyle }}">주봉</div>
</div>
<iframe data-chart-frame="1" title="{{ stockName }} TradingView 차트" src="{{ tradingViewChartUrl }}" width="330" height="264" loading="eager" style="display:block;margin-top:16px;border:0;background:#FFFFFF"></iframe>
</div>

<div style="background:#FFFFFF;border-radius:26px;padding:16px 18px;box-shadow:0 2px 10px rgba(30,25,60,0.05)">
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:15.5px;font-weight:800;color:#01185A;white-space:nowrap">캔들이 뭐야?</span></div>
<div style="font-size:14px;font-weight:500;color:#5C6280;line-height:1.75;margin-top:9px;text-wrap:pretty">막대 하나가 하루야. 그날 시작한 값보다 끝난 값이 높으면 <b style="color:#E8322E">빨간 막대</b>, 낮으면 <b style="color:#1668DC">파란 막대</b>가 돼. 위아래로 나온 선은 그날 가장 비쌌던 값과 가장 쌌던 값이야.</div>
<div style="display:flex;gap:8px;margin-top:12px">
<div style="flex:1;background:#FFF4F4;border-radius:14px;padding:11px 13px"><div style="font-size:12.5px;font-weight:600;color:#E8322E">빨간 막대</div><div style="font-size:12.5px;font-weight:500;color:#7E849B;margin-top:4px;line-height:1.5">그날 값이 올랐어</div></div>
<div style="flex:1;background:#F1F5FD;border-radius:14px;padding:11px 13px"><div style="font-size:12.5px;font-weight:600;color:#1668DC">파란 막대</div><div style="font-size:12.5px;font-weight:500;color:#7E849B;margin-top:4px;line-height:1.5">그날 값이 내렸어</div></div>
</div>
</div>
</div>
<div style="flex:none;padding:14px 16px 26px">
<sc-if value="{{ tradeLocked }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:11px;background:#FFF6FA;border-radius:20px;padding:14px 16px;margin-bottom:11px;box-shadow:inset 0 0 0 1.5px rgba(245,50,127,0.22)">
<span style="font-size:14px;font-weight:600;color:#D5327A;line-height:1.55;text-wrap:pretty">지금은 학교에서 공부할 시간! 매매는 하교하고 하자</span>
</div>
</sc-if>
<div onClick="{{ startBuy }}" style="{{ ctaStyle }}"><span style="text-shadow:0 1px 2px rgba(170,30,95,0.22)">사볼래! (매수)</span></div>
</div>
</div>
</sc-if>
