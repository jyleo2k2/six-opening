<sc-if value="{{ isNews }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;padding-top:59px;display:flex;flex-direction:column">
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:6px 18px 10px">
<div onClick="{{ closeSub }}" style="{{ backBtnStyle }}">‹</div>
<div style="flex:1;text-align:center;font-size:19px;font-weight:800;color:#01185A;letter-spacing:-0.01em">요즘 무슨 일이</div>
<div style="width:38px"></div>
</div>
<div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 16px 0;display:flex;flex-direction:column;gap:12px">

<div style="background:#FDEFF5;border-radius:28px;padding:18px 20px;box-shadow:0 2px 10px rgba(90,25,70,0.06)">
<div style="font-size:13px;font-weight:700;color:#D5327A">{{ newsKicker }}</div>
<div style="font-size:21px;font-weight:800;color:#01185A;line-height:1.45;margin-top:9px;letter-spacing:-0.02em;text-wrap:pretty">{{ newsHeadline }}</div>
</div>

<div style="background:#FFFFFF;border-radius:26px;padding:17px 19px;box-shadow:0 2px 10px rgba(30,25,60,0.05)">
<div style="font-size:15.5px;font-weight:800;color:#01185A">3줄 요약</div>
<div style="display:flex;flex-direction:column;gap:10px;margin-top:13px">
<sc-for list="{{ newsLines }}" as="p" hint-placeholder-count="3">
<div style="display:flex;align-items:flex-start;gap:10px">
<div style="{{ p.numStyle }}">{{ p.n }}</div>
<div style="flex:1;font-size:14px;font-weight:500;color:#5C6280;line-height:1.6;padding-top:2px">{{ p.text }}</div>
</div>
</sc-for>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FFFFFF;border-radius:22px;padding:14px 16px;box-shadow:0 10px 24px rgba(35,25,80,0.08),inset 0 0 0 1px rgba(255,255,255,0.7)">
<div style="min-width:0;font-size:13px;font-weight:500;color:#8E93A8;line-height:1.5">{{ newsSourceText }}</div>
<div onClick="{{ openNewsSource }}" style="flex:none;font-size:13.5px;font-weight:800;color:#D5327A;cursor:pointer;padding:8px 2px 8px 10px;white-space:nowrap">원문 보기 ↗</div>
</div>

<div style="display:flex;align-items:flex-start;gap:10px;background:#ECEDF7;border-radius:22px;padding:14px 16px;box-shadow:inset 0 0 0 1px #E4E6F1">
<div style="flex:1;font-size:13.5px;font-weight:500;color:#5C6280;line-height:1.65;text-wrap:pretty">이건 이 회사가 좋다 나쁘다는 이야기가 아니야. 무슨 일이 있었는지만 알려주는 거야.</div>
</div>
</div>
<div style="flex:none;padding:14px 16px 26px">
<sc-if value="{{ tradeLocked }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:11px;background:#FFF6FA;border-radius:20px;padding:14px 16px;margin-bottom:11px;box-shadow:inset 0 0 0 1.5px rgba(245,50,127,0.22)">
<span style="font-size:14px;font-weight:600;color:#D5327A;line-height:1.55;text-wrap:pretty">지금은 학교에서 공부할 시간! 매매는 하교하고 하자</span>
</div>
</sc-if>
<div onClick="{{ startBuy }}" style="{{ ctaStyle }}"><span style="text-shadow:0 1px 2px rgba(170,30,95,0.22)">사볼래! (매수)</span></div>
</div>
</div>
</sc-if>
