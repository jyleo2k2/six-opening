<sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;padding-top:59px;display:flex;flex-direction:column">
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:6px 18px 10px">
<div onClick="{{ goExplore }}" style="{{ backBtnStyle }}">‹</div>
<div style="flex:1;text-align:center;font-size:19px;font-weight:800;color:#01185A;letter-spacing:-0.01em">{{ stockName }}</div>
<div onClick="{{ toggleWatch }}" style="{{ watchBtnStyle }}">
<svg width="21" height="19" viewBox="0 0 21 19" style="display:block"><path d="M10.5 17.5 2.6 9.9a4.6 4.6 0 1 1 7.9-4.4 4.6 4.6 0 1 1 7.9 4.4z" fill="{{ watchFill }}" stroke="{{ watchStroke }}" stroke-width="1.6" stroke-linejoin="round"></path></svg>
</div>
</div>

<div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 16px 0;display:flex;flex-direction:column;gap:11px">

<div style="background:#FFFFFF;border-radius:30px;padding:18px 20px;box-shadow:0 2px 10px rgba(30,25,60,0.05)">
<div style="display:flex;align-items:center;gap:12px">
<div style="{{ detailBadgeStyle }}">{{ stockEmoji }}</div>
<div style="flex:1;min-width:0">
<div style="font-size:14.5px;font-weight:500;color:#8E93A8">지금 가격</div>
<div style="font-size:34px;font-weight:800;color:#01185A;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;white-space:nowrap;letter-spacing:-0.02em">{{ stockPriceText }}</div>
</div>
<span style="{{ detailChangeStyle }}">{{ stockChangeText }}</span>
</div>
<svg width="336" height="112" viewBox="0 0 336 112" preserveAspectRatio="none" style="display:block;margin-top:14px">
<polyline points="{{ stockSparkBig }}" fill="none" stroke="{{ stockLineColor }}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"></polyline>
</svg>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">
<span style="font-size:13px;font-weight:500;color:#A9AEC4">최근 흐름 · 15분 지연 시세</span>
<div onClick="{{ openChart }}" style="{{ moreBtnStyle }}">차트 자세히 보기 ›</div>
</div>
</div>

<div style="background:#FFFFFF;border-radius:26px;padding:16px 18px;box-shadow:0 2px 10px rgba(30,25,60,0.05)">
<div style="display:flex;align-items:center;gap:9px"><span style="font-size:17.5px;font-weight:800;color:#01185A;white-space:nowrap">이 회사는 뭘 해?</span></div>
<div style="font-size:16px;font-weight:500;color:#5C6280;line-height:1.75;margin-top:10px;text-wrap:pretty">{{ stockDescLong }}</div>
</div>

<div style="background:#FFFFFF;border-radius:26px;padding:16px 18px;box-shadow:0 2px 10px rgba(30,25,60,0.05)">
<div style="display:flex;align-items:center;gap:9px"><span style="font-size:17.5px;font-weight:800;color:#01185A;white-space:nowrap">요즘 무슨 일이 있었어?</span></div>
<div style="font-size:16px;font-weight:500;color:#5C6280;line-height:1.75;margin-top:10px;text-wrap:pretty">{{ stockNews }}</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:13px">
<span style="font-size:13px;font-weight:500;color:#A9AEC4">키움 뉴스를 어린이 눈높이로</span>
<div onClick="{{ openNews }}" style="{{ newsMoreBtnStyle }}">{{ newsMoreLabel }} ›</div>
</div>
</div>

</div>

<div style="flex:none;padding:14px 16px 26px">
<sc-if value="{{ tradeLocked }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:11px;background:#FFF6FA;border-radius:20px;padding:14px 16px;margin-bottom:11px;box-shadow:inset 0 0 0 1.5px rgba(245,50,127,0.22)">
<span style="font-size:14px;font-weight:600;color:#D5327A;line-height:1.55;text-wrap:pretty">지금은 학교에서 공부할 시간! 매매는 하교하고 하자</span>
</div>
</sc-if>
<div id="tut-buy-cta" onClick="{{ startBuy }}" style="{{ ctaStyle }}"><span style="text-shadow:0 1px 2px rgba(170,30,95,0.22)">사볼래! (매수)</span></div>
</div>
</div>
</sc-if>
