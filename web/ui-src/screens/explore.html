<sc-if value="{{ isExplore }}" hint-placeholder-val="{{ false }}">
<div style="{{ exploreBgStyle }}">
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:6px 18px 10px">
<div onClick="{{ goHome }}" style="{{ backBtnStyle }}">‹</div>
<div style="flex:1;text-align:center;font-size:19px;font-weight:800;color:#01185A;letter-spacing:-0.01em">어떤 회사를 살까?</div>
<div style="width:38px"></div>
</div>

<div style="flex:none;padding:0 16px 10px;display:flex;align-items:center;gap:8px">
<input value="{{ stockQuery }}" onInput="{{ onStockQuery }}" placeholder="회사 이름으로 찾기" style="flex:1;min-width:0;box-sizing:border-box;border:0;outline:none;background:#FFFFFF;border-radius:14px;padding:12px 14px;font-family:'Pretendard',sans-serif;font-size:14.5px;font-weight:600;color:#01185A;box-shadow:0 1px 3px rgba(30,25,60,0.08)">
<sc-if value="{{ hasStockQuery }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ clearStockQuery }}" style="flex:none;font-size:13px;font-weight:700;color:#8E93A8;padding:11px 13px;border-radius:14px;cursor:pointer;background:#FFFFFF;box-shadow:0 1px 3px rgba(30,25,60,0.08)">지우기</div>
</sc-if>
</div>

<div id="tut-chips" style="flex:none;overflow-x:auto;padding:2px 0 12px">
<div style="display:flex;gap:8px;padding:0 16px;width:max-content">
<sc-for list="{{ sectorChips }}" as="s" hint-placeholder-count="5">
<div onClick="{{ s.pick }}" style="{{ s.style }}"><span>{{ s.name }}</span></div>
</sc-for>
</div>
</div>

<div style="flex:none;display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 8px">
<span style="font-size:13.5px;font-weight:600;color:#01185A;white-space:nowrap">{{ sectorTitle }}</span>
<span style="font-size:12.5px;font-weight:500;color:#A9AEC4;white-space:nowrap">손가락으로 슉 밀어봐 →</span>
</div>

<sc-if value="{{ noCards }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;gap:9px">
<div style="font-size:16px;font-weight:800;color:#01185A;text-align:center">{{ noCardsTitle }}</div>
<div style="font-size:13.5px;font-weight:500;color:#8E93A8;line-height:1.6;text-align:center;text-wrap:pretty">{{ noCardsHint }}</div>
</div>
</sc-if>

<div style="{{ stageStyle }}">
<div id="tut-cards" ref="{{ cardsRef }}" onPointerDown="{{ cardsDown }}" onScroll="{{ cardsScroll }}" style="position:relative;flex:1;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;gap:33px;padding:2px 46px 6px;scroll-snap-type:x mandatory;cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
<div style="{{ c.slideStyle }}">
<div style="{{ c.auraMain }}"></div>
<div style="{{ c.auraNeon }}"></div>
<div style="{{ c.auraTrend }}"></div>
<div onClick="{{ c.pick }}" style="{{ c.cardStyle }}">
<div style="{{ c.gridStyle }}"></div>
<div style="{{ c.sheenStyle }}"></div>
<svg width="310" height="340" viewBox="0 0 310 340" style="position:absolute;left:0;top:0;pointer-events:none">
<circle cx="196" cy="118" r="1.5" fill="#FFFFFF" fill-opacity="0.45"></circle>
<circle cx="86" cy="206" r="1.2" fill="{{ c.brand }}" fill-opacity="0.7"></circle>
<circle cx="268" cy="176" r="1.1" fill="#FFFFFF" fill-opacity="0.3"></circle>
<circle cx="146" cy="66" r="1" fill="{{ c.brand }}" fill-opacity="0.6"></circle>
<rect x="6" y="6" width="298" height="328" rx="34" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-opacity="0.05"></rect>
<rect x="6" y="6" width="298" height="328" rx="34" fill="none" stroke="#8FB0E8" stroke-width="5" stroke-opacity="0.16"></rect>
<rect x="6" y="6" width="298" height="328" rx="34" fill="none" stroke="{{ c.lineColor }}" stroke-width="1.6" stroke-opacity="0.35"></rect>
<path d="M236 6 H270 A34 34 0 0 1 304 40 V86 L291 74 V29 H249 Z" fill="#070C1C" fill-opacity="0.9"></path>
<path d="M249 29 H291 V74" fill="none" stroke="{{ c.lineColor }}" stroke-width="1.2" stroke-opacity="0.5"></path>
<path d="M254 13 l11 11 M267 13 l11 11 M280 15 l10 10" stroke="{{ c.lineColor }}" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"></path>
<path d="M6 266 V300 A34 34 0 0 0 40 334 H86 L74 322 H31 V278 Z" fill="#070C1C" fill-opacity="0.85"></path>
<path d="M16 300 l12 12 M16 286 l26 26" stroke="{{ c.lineColor }}" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"></path>
<path d="M286 318 l8 -8 M295 309 l6 -6" stroke="{{ c.lineColor }}" stroke-width="1.8" stroke-opacity="0.7" stroke-linecap="round"></path>
<path d="M6 128 V40 A34 34 0 0 1 40 6 H132" fill="none" stroke="{{ c.lineColor }}" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 7px {{ c.lineColor }})"></path>
<path d="M236 6 H270 A34 34 0 0 1 304 40 V86" fill="none" stroke="{{ c.lineColor }}" stroke-width="2.6" stroke-linecap="round" style="filter:drop-shadow(0 0 5px {{ c.lineColor }})"></path>
<path d="M304 150 V214" fill="none" stroke="{{ c.lineColor }}" stroke-width="3.4" stroke-linecap="round" style="filter:drop-shadow(0 0 7px {{ c.lineColor }})"></path>
<path d="M304 258 V300 A34 34 0 0 1 270 334 H244" fill="none" stroke="{{ c.lineColor }}" stroke-width="1.8" stroke-opacity="0.4" stroke-linecap="round"></path>
<path d="M96 334 H40 A34 34 0 0 1 6 300 V268" fill="none" stroke="{{ c.lineColor }}" stroke-width="2.6" stroke-opacity="0.55" stroke-linecap="round"></path>
<path d="M6 190 V236" fill="none" stroke="{{ c.lineColor }}" stroke-width="1.6" stroke-opacity="0.3" stroke-linecap="round"></path>
<path d="M132 334 H186" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-opacity="0.9" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #FFFFFF)"></path>
<path d="M140 6 H186" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"></path>
<path d="M6 72 V104" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.45" stroke-linecap="round"></path>
<path d="M304 108 V138" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"></path>
<path d="M28 120 L39 129 H105 L116 120" fill="none" stroke="{{ c.lineColor }}" stroke-width="2.2" stroke-opacity="0.9" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px {{ c.lineColor }})"></path>
<path d="M50 133 H94" fill="none" stroke="{{ c.lineColor }}" stroke-width="1" stroke-opacity="0.45" stroke-linecap="round"></path>
</svg>
<div style="{{ c.artStyle }}">
<sc-if value="{{ c.noLogo }}" hint-placeholder-val="{{ true }}">
<span style="font-size:40px">{{ c.emoji }}</span>
</sc-if>
</div>
<div style="{{ c.catStyle }}">{{ c.category }}</div>
<svg width="140" height="8" viewBox="0 0 140 8" style="{{ c.catBarStyle }}">
<path d="M2 7 L8 1 M11 7 L17 1 M20 7 L26 1 M29 7 L35 1" stroke="{{ c.brand }}" stroke-width="2.6" stroke-linecap="round"></path>
<path d="M42 4 H126" fill="none" stroke="{{ c.brand }}" stroke-width="1.4" stroke-opacity="0.45"></path>
<circle cx="133" cy="4" r="3.4" fill="{{ c.brand }}" style="filter:drop-shadow(0 0 4px {{ c.brand }})"></circle>
</svg>
<div style="{{ c.nameStyle }}">{{ c.name }}</div>
<div style="{{ c.descStyle }}">{{ c.desc }}</div>
<div style="{{ c.priceStyle }}">{{ c.priceText }}</div>
<div style="{{ c.changeStyle }}">{{ c.changeText }}</div>
<svg width="127" height="104" viewBox="0 0 127 104" style="{{ c.chartStyle }}">
<defs><linearGradient id="{{ c.gradId }}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{ c.lineColor }}" stop-opacity="0.42"></stop>
<stop offset="1" stop-color="{{ c.lineColor }}" stop-opacity="0"></stop>
</linearGradient></defs>
<path d="{{ c.sparkArea }}" fill="{{ c.areaFill }}"></path>
<polyline points="{{ c.sparkLine }}" fill="none" stroke="{{ c.lineColor }}" stroke-width="9" stroke-opacity="0.13" stroke-linejoin="round" stroke-linecap="round"></polyline>
<polyline points="{{ c.sparkLine }}" fill="none" stroke="{{ c.lineColor }}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px {{ c.lineColor }})"></polyline>
<circle cx="{{ c.endX }}" cy="{{ c.endY }}" r="10" fill="{{ c.lineColor }}" fill-opacity="0.24"></circle>
<circle cx="{{ c.endX }}" cy="{{ c.endY }}" r="4.2" fill="#FFFFFF" style="filter:drop-shadow(0 0 7px {{ c.lineColor }})"></circle>
</svg>
</div>
</div>
</sc-for>
</div>
<div style="position:relative;flex:none;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 0 14px">
<sc-for list="{{ cardDots }}" as="d" hint-placeholder-count="8">
<div style="{{ d.style }}"></div>
</sc-for>
<span style="margin-left:8px;font-size:11.5px;font-weight:700;color:#A8A6C4;font-variant-numeric:tabular-nums;white-space:nowrap">{{ cardCountText }}</span>
</div>
</div>

<div style="{{ navStyleX }}">
<div onClick="{{ goHome }}" style="{{ navHomeX }}"><div style="font-size:13.5px;font-weight:700;padding:4px 0">홈</div></div>
<div onClick="{{ goExplore }}" style="{{ navTradeX }}"><div style="font-size:13.5px;font-weight:700;padding:4px 0">모의투자</div></div>
<div onClick="{{ goArchive }}" style="{{ navArchiveX }}"><div style="font-size:13.5px;font-weight:700;padding:4px 0">아카이브</div></div>
<div onClick="{{ goRanking }}" style="{{ navRankingX }}"><div style="font-size:13.5px;font-weight:700;padding:4px 0">랭킹</div></div>
</div>
</div>
</sc-if>
