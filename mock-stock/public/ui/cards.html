<meta charset="utf-8">
<title>게임형 종목카드 51</title>
<style>
  body{font-family:'Malgun Gothic',sans-serif;background:#04060D;margin:0;padding:26px;color:#E8EEFB}
  h1{font-size:20px;margin:0 0 6px}
  p.s{color:#8095BC;font-size:13px;margin:0 0 22px}
  h2{font-size:14px;color:#8095BC;margin:30px 0 14px}
  .row{display:flex;gap:20px;flex-wrap:wrap}
</style>
<h1>게임형 종목카드 51장</h1>
<p class="s">앱과 같은 데이터로 그립니다 — 가격·등락률·차트 모두 <code>/api/universe</code>(키움) 값입니다. 상승 빨강 / 하락 파랑.</p>
<div id="out"></div>
<script src="/api/universe"></script>
<script>
(function () {
  var SEC = { semi:'반도체', game:'게임', food:'식품', auto:'자동차', enter:'엔터', beauty:'화장품', air:'항공', ship:'조선', defense:'방산', energy:'에너지', retail:'유통', logi:'물류', bank:'은행·금융' };
  var u = window.KW_UNIVERSE;
  if (!u) { document.getElementById('out').textContent = 'universe 로드 실패'; return; }
  var mixW = function (hx, w) { var n = parseInt(hx.slice(1), 16); var c = [(n>>16)&255,(n>>8)&255,n&255].map(function(v){return Math.round(v+(255-v)*w);}); return '#' + c.map(function(v){return v.toString(16).padStart(2,'0');}).join(''); };
  var F = function (s) { return 'style="filter:drop-shadow(0 0 ' + s + ')"'; };

  function card(x) {
    var br = (u.brands || {})[x.code] || { cat:'', color:'#5B87E8', dark:false };
    var B = br.color, BL = mixW(B, 0.45), up = x.change >= 0, CL = up ? '#E8322E' : '#1668DC';
    var logo = (u.logos || {})[x.code] || '';
    var sp = x.spark || [], W = 128, H = 118, PL = 6, PR = 17, PY = 14, N = Math.max(2, sp.length);
    var pts = sp.map(function (v, i) { return [PL + i * ((W - PL - PR) / (N - 1)), (H - PY) - (v / 100) * (H - PY * 2)]; });
    var xy = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); });
    var last = pts[pts.length - 1] || [W - PR, H / 2];
    return '<div style="position:relative;overflow:hidden;flex:none;width:306px;height:348px;border-radius:32px;padding:20px;display:flex;flex-direction:column;background:radial-gradient(95% 60% at 26% -6%,' + B + '5C 0%,rgba(10,16,34,0) 62%),radial-gradient(70% 50% at 100% 100%,' + B + '2B 0%,rgba(5,7,15,0) 70%),linear-gradient(158deg,#101B38 0%,#0A1126 44%,#05070F 100%);box-shadow:0 28px 54px -16px rgba(0,0,0,0.8),0 0 42px -10px ' + B + 'A6">'
      + '<div style="position:absolute;left:-30px;top:-70px;width:210px;height:200px;border-radius:999px;filter:blur(42px);opacity:0.45;background:' + B + '"></div>'
      + '<div style="position:absolute;left:0;right:0;bottom:0;height:58%;opacity:0.45;background-image:linear-gradient(' + B + '2B 1px,transparent 1px),linear-gradient(90deg,' + B + '2B 1px,transparent 1px);background-size:26px 26px"></div>'
      + '<div style="position:absolute;left:-55%;top:-40%;width:62%;height:200%;transform:rotate(22deg);background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.16) 48%,rgba(255,255,255,0) 100%)"></div>'
      + '<svg width="306" height="348" viewBox="0 0 306 348" style="position:absolute;left:0;top:0;pointer-events:none">'
      + '<circle cx="232" cy="118" r="1.6" fill="#FFFFFF" fill-opacity="0.5"></circle><circle cx="262" cy="196" r="1.2" fill="' + B + '" fill-opacity="0.8"></circle>'
      + '<circle cx="46" cy="236" r="1.4" fill="#FFFFFF" fill-opacity="0.28"></circle><circle cx="196" cy="96" r="1" fill="' + B + '" fill-opacity="0.7"></circle>'
      + '<rect x="5.5" y="5.5" width="295" height="337" rx="27" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-opacity="0.055"></rect>'
      + '<rect x="17" y="17" width="272" height="314" rx="19" fill="none" stroke="' + B + '" stroke-width="1" stroke-opacity="0.22"></rect>'
      + '<rect x="5.5" y="5.5" width="295" height="337" rx="27" fill="none" stroke="' + B + '" stroke-width="2.5" stroke-opacity="0.9" ' + F('6px ' + B) + '></rect>'
      + '<path d="M5.5 104 V37 A31.5 31.5 0 0 1 37 5.5 H112" fill="none" stroke="' + B + '" stroke-width="4.5" stroke-linecap="round" ' + F('7px ' + B) + '></path>'
      + '<path d="M16 104 V45 A23 23 0 0 1 39 22 H104" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.42" stroke-linecap="round"></path>'
      + '<path d="M5.5 244 V311 A31.5 31.5 0 0 0 37 342.5 H112" fill="none" stroke="' + B + '" stroke-width="4.5" stroke-linecap="round" ' + F('7px ' + B) + '></path>'
      + '<path d="M194 5.5 H269 A31.5 31.5 0 0 1 300.5 37 V104" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.6" stroke-linecap="round"></path>'
      + '<path d="M194 342.5 H269 A31.5 31.5 0 0 0 300.5 311 V244" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.5" stroke-linecap="round"></path>'
      + '<path d="M240 14 l14 14 M258 14 l14 14" stroke="' + B + '" stroke-width="3" stroke-linecap="round"></path>'
      + '<path d="M276 12 h14 a5 5 0 0 1 5 5 v13 z" fill="' + B + '" fill-opacity="0.55"></path>'
      + '<path d="M14 318 l12 12 M14 300 l30 30" stroke="' + B + '" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"></path>'
      + '<path d="M126 342.5 H180" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.9" stroke-linecap="round" ' + F('6px #FFFFFF') + '></path></svg>'
      + '<div style="position:absolute;left:26px;top:117px;width:92px;height:14px;border-radius:999px;filter:blur(7px);opacity:0.55;background:radial-gradient(closest-side,' + B + ' 0%,rgba(0,0,0,0) 100%)"></div>'
      + '<div style="position:relative;display:flex;align-items:flex-start;gap:14px">'
      + '<div style="position:relative;width:104px;height:104px;flex:none;background:url(' + logo + ') center/contain no-repeat;filter:drop-shadow(0 0 18px ' + B + 'B3)' + (br.dark ? ' drop-shadow(0 0 9px rgba(255,255,255,0.75))' : '') + ' drop-shadow(0 16px 16px rgba(0,0,0,0.55))"></div>'
      + '<div style="flex:1;min-width:0;padding-top:34px"><div style="font-size:11.5px;font-weight:800;letter-spacing:0.26em;color:' + BL + ';white-space:nowrap;text-shadow:0 0 12px ' + B + '">' + br.cat + '</div>'
      + '<svg width="140" height="7" viewBox="0 0 140 7" style="position:relative;height:7px;margin-top:11px">'
      + '<path d="M2 6 L7 1 M9 6 L14 1 M16 6 L21 1 M23 6 L28 1" stroke="' + B + '" stroke-width="2.4" stroke-linecap="round"></path>'
      + '<path d="M34 3.5 H128" stroke="' + B + '" stroke-width="1.5" stroke-opacity="0.4"></path>'
      + '<circle cx="133" cy="3.5" r="3.2" fill="' + B + '" ' + F('4px ' + B) + '></circle></svg></div></div>'
      + '<div style="position:relative;font-size:30px;font-weight:800;color:#fff;margin-top:22px;letter-spacing:-0.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 16px rgba(0,0,0,0.65),0 0 22px ' + B + '4D">' + x.name + '</div>'
      + '<div style="position:relative;font-size:13.5px;font-weight:600;color:#92AEDA;line-height:1.5;margin-top:9px;height:21px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">' + x.desc + '</div>'
      + '<div style="position:relative;margin-top:auto">'
      + '<div style="font-size:' + (x.price >= 1000000 ? 29 : 35) + 'px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-0.035em;line-height:1;text-shadow:0 3px 18px rgba(0,0,0,0.7)">' + x.price.toLocaleString('ko-KR') + '</div>'
      + '<div style="display:inline-flex;align-items:center;margin-top:13px;padding:8px 18px;border-radius:999px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,' + CL + 'E6 0%,' + CL + '99 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.45),inset 0 0 0 2px ' + CL + ',0 8px 18px -6px ' + CL + 'CC,0 0 22px -6px ' + CL + '">' + (up ? '▲ ' : '▼ ') + Math.abs(x.change).toFixed(2) + '%</div></div>'
      + '<svg width="128" height="118" viewBox="0 0 128 118" style="position:absolute;right:19px;bottom:22px">'
      + '<path d="M' + xy.join(' L ') + ' L ' + (W - PR) + ',' + (H - 4) + ' L ' + PL + ',' + (H - 4) + ' Z" fill="' + CL + '" fill-opacity="0.22"></path>'
      + '<polyline points="' + xy.join(' ') + '" fill="none" stroke="' + CL + '" stroke-width="10" stroke-opacity="0.14" stroke-linejoin="round" stroke-linecap="round"></polyline>'
      + '<polyline points="' + xy.join(' ') + '" fill="none" stroke="' + CL + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" ' + F('5px ' + CL) + '></polyline>'
      + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="11" fill="' + CL + '" fill-opacity="0.26"></circle>'
      + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4.5" fill="#fff" ' + F('7px ' + CL) + '></circle></svg>'
      + '</div>';
  }

  var html = '';
  Object.keys(SEC).forEach(function (s) {
    var list = u.stocks.filter(function (x) { return x.sector === s; });
    if (!list.length) return;
    html += '<h2>' + SEC[s] + ' · ' + list.length + '곳</h2><div class="row">' + list.map(card).join('') + '</div>';
  });
  document.getElementById('out').innerHTML = html;
})();
</script>
