      <g fill="#FFFFFF">
        <rect x="291" y="48" width="3" height="6" rx="1"/>
        <rect x="297" y="44" width="3" height="10" rx="1"/>
        <rect x="303" y="40" width="3" height="14" rx="1"/>
        <path d="M314 45q10-9 20 0M317 49q7-6 14 0M321 53q3-3 6 0" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="340" y="41" width="22" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
        <rect x="362" y="44" width="2" height="5" rx="1"/>
