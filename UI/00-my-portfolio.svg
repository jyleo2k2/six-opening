        <text x="70" y="433" text-anchor="middle" font-size="11" font-weight="800" fill="#E6007E">SK</text>
        <text x="104" y="423" font-size="14" font-weight="700" fill="#14213D">SK하이닉스</text>
        <text x="104" y="443" font-size="11" font-weight="600" fill="#6A7894">2주 · 397,000원</text>
        <text x="342" y="423" text-anchor="end" font-size="13" font-weight="800" fill="#14213D">+3.1%</text>
        <text x="342" y="443" text-anchor="end" font-size="10" font-weight="700" fill="#EF3340">+11,900원</text>
      </g>
      <line x1="48" y1="461" x2="342" y2="461" stroke="#DFE3EA"/>

      <g>
        <rect x="48" y="474" width="44" height="44" rx="13" fill="#F0F2F5"/>
        <text x="70" y="501" text-anchor="middle" font-size="10" font-weight="800" fill="#14213D">현대</text>
        <text x="104" y="491" font-size="14" font-weight="700" fill="#14213D">현대차</text>
        <text x="104" y="511" font-size="11" font-weight="600" fill="#6A7894">1주 · 241,000원</text>
