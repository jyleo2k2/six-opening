      <text x="80" y="783" text-anchor="middle" font-size="10" font-weight="800" fill="#E6007E">포트폴리오</text>

      <g fill="none" stroke="#8A96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
