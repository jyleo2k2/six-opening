      <text x="40" y="127" font-size="21" font-weight="800" fill="#FFFFFF">내 포트폴리오</text>
      <circle cx="339" cy="107" r="16" fill="#163B7B"/>
      <path d="M334 105a5 5 0 1 1 10 0v4l2 3h-14l2-3v-4M337 115h4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

