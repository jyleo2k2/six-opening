      <rect x="19" y="711" width="352" height="114" fill="#FFFFFF"/>
      <line x1="19" y1="711" x2="371" y2="711" stroke="#E7EAF0"/>
      <g fill="#E6007E" stroke="#E6007E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M69 746l11-9 11 9v14H72v-11" fill="none"/>
        <rect x="77" y="752" width="6" height="8" rx="1" fill="#E6007E" stroke="none"/>
