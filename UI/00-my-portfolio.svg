      </g>
      <text x="195" y="783" text-anchor="middle" font-size="10" font-weight="700" fill="#8A96AA">투자 기록</text>

      <g fill="none" stroke="#8A96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M300 741c7-4 14-4 20 0v20c-6-4-13-4-20 0zM300 741c-7-4-14-4-20 0v20c6-4 13-4 20 0z"/>
      </g>
      <text x="300" y="783" text-anchor="middle" font-size="10" font-weight="700" fill="#8A96AA">배우기</text>

