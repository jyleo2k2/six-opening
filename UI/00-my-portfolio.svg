        <circle cx="123" cy="666" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
        <path d="M129 672l6 6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <text x="211" y="672" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">새로운 회사 찾아보기</text>
