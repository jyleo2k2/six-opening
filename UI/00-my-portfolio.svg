      <text x="50" y="174" font-size="11" font-weight="700" fill="#6A7894">내 투자금</text>
      <text x="50" y="207" font-size="27" font-weight="800" fill="#14213D">1,026,700원</text>
      <rect x="50" y="222" width="88" height="25" rx="12.5" fill="#FFF0F1"/>
      <text x="94" y="239" text-anchor="middle" font-size="10" font-weight="700" fill="#EF3340">+1.91%</text>
      <text x="148" y="239" font-size="10" font-weight="600" fill="#EF3340">+19,300원</text>
      <rect x="269" y="168" width="67" height="67" rx="18" fill="#FDE7F4"/>
      <rect x="286" y="195" width="7" height="20" rx="3.5" fill="#E6007E"/>
      <rect x="299" y="185" width="7" height="30" rx="3.5" fill="#E6007E" opacity="0.72"/>
      <rect x="312" y="176" width="7" height="39" rx="3.5" fill="#E6007E" opacity="0.45"/>

