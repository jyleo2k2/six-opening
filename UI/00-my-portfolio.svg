<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">내 포트폴리오</title>
  <desc id="desc">어린이 모의투자 서비스의 첫 화면. 나의 투자 현황과 보유 주식을 확인하고 새로운 회사를 찾아볼 수 있다.</desc>
  <rect width="390" height="844" fill="#FFFFFF"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
