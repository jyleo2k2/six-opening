<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영웅 키움 — Button · Card · Chip · TabBar</title>
<style>
:root{
  --navy:#001E5A; --magenta:#D70082; --gray:#BEBEBE; --bg:#F6F7FA;
  --white:#FFFFFF; --up:#E8322E; --down:#1668DC; --ink:#1A2233;
  --font:'Pretendard','Segoe UI','Malgun Gothic',sans-serif;
  --shadow:0 1px 3px rgba(0,30,90,.08);
}
body{margin:0;padding:24px;background:var(--bg);font-family:var(--font);color:var(--ink);}
h1{font-size:20px;margin:0 0 20px}
.sec{background:var(--white);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.sec h2{font-size:13px;color:#6B7280;margin:0 0 14px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Button */
.btn{border:0;border-radius:12px;font-family:var(--font);font-size:15px;font-weight:700;padding:14px 22px;cursor:pointer}
.btn-primary{background:var(--magenta);color:#fff}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn-disabled{background:var(--gray);color:#fff}
.btn-block{display:block;width:100%;text-align:center}

/* Chip */
.chip{border:1.5px solid var(--gray);background:#fff;color:var(--ink);border-radius:999px;font-family:var(--font);font-size:13px;padding:9px 15px;cursor:pointer}
.chip-on{border-color:var(--magenta);background:var(--magenta);color:#fff;font-weight:600}

/* Card */
.demo-card{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid #EEF0F4}
.demo-card .t{font-size:16px;font-weight:600;margin:0 0 6px}
.demo-card .b{font-size:14px;color:#4B5563;margin:0;line-height:1.6}
.navy-card{background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px}
.navy-card .t{font-size:12px;opacity:.75;margin:0 0 6px}
.navy-card .v{font-size:24px;font-weight:700;margin:0;font-variant-numeric:tabular-nums}

/* TabBar */
.phone{width:330px;border:1px solid #E5E7EB;border-radius:16px;overflow:hidden;background:#fff}
.tabbar{display:flex;border-top:1px solid #EEF0F4;background:#fff}
.tab{flex:1;text-align:center;padding:11px 0 13px;font-size:11px;color:#9AA1AE}
.tab .ic{display:block;font-size:19px;margin-bottom:3px;filter:grayscale(1);opacity:.45}
.tab.on{color:var(--magenta);font-weight:700}
.tab.on .ic{filter:none;opacity:1}
.note{font-size:12px;color:#6B7280;margin:12px 0 0;line-height:1.6}
</style>
</head>
<body>
<h1>기본 컴포넌트</h1>

<div class="sec">
  <h2>Button — primary = magenta / secondary = navy 선</h2>
  <div class="row">
    <button class="btn btn-primary">매수하기</button>
    <button class="btn btn-secondary">매도</button>
    <button class="btn btn-disabled">한도 초과</button>
  </div>
  <div style="margin-top:12px">
    <button class="btn btn-primary btn-block">모의투자 하러 가기</button>
  </div>
</div>

<div class="sec">
  <h2>Chip — 선택형 (근거 태깅 · 보유기간 · 추천 질문 · 사고과정)</h2>
  <div class="row">
    <button class="chip">뉴스에서 봤어</button>
    <button class="chip">차트가 좋아 보여</button>
    <button class="chip chip-on">이 회사를 잘 알아</button>
    <button class="chip">그냥 느낌이 좋아</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="chip">이번 주만</button>
    <button class="chip chip-on">시즌 끝까지</button>
    <button class="chip">모르겠어요</button>
  </div>
</div>

<div class="sec">
  <h2>Card — 흰 카드 / 네이비 강조 카드</h2>
  <div class="row" style="align-items:stretch">
    <div class="demo-card" style="flex:1">
      <p class="t">이 회사는 무슨 일을 해?</p>
      <p class="b">우리가 쓰는 휴대폰이랑 TV를 만드는 회사야. 반도체도 만들어!</p>
    </div>
    <div class="navy-card" style="width:150px">
      <p class="t">우리 가족 순위</p>
      <p class="v">4위</p>
      <p class="t" style="margin:4px 0 0">42가족 중</p>
    </div>
  </div>
</div>

<div class="sec">
  <h2>TabBar — 3개 고정</h2>
  <div class="phone">
    <div style="height:56px;background:var(--bg)"></div>
    <div class="tabbar">
      <div class="tab on"><span class="ic">🏠</span>홈</div>
      <div class="tab"><span class="ic">📈</span>투자</div>
      <div class="tab"><span class="ic">📔</span>아카이브</div>
    </div>
  </div>
  <p class="note">홈 / 투자 / 아카이브. <b>주문은 탭이 아니라 종목 상세에서 진입</b>한다. 탭을 4개로 늘리지 않는다.</p>
</div>
</body>
</html>
