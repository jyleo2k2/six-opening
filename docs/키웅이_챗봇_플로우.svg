<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ===== 제목 ===== -->
  <text x="60" y="96" font-size="36" font-weight="800" fill="#001E5A">키웅이 챗봇 — 응답 파이프라인</text>
  <text x="60" y="138" font-size="19" fill="#5B6577">물어보면 답하고, 헤매면 먼저 돕는다 — 추천은 말버릇이 아니라 구조로 막는다</text>
  <text x="1860" y="96" font-size="15" fill="#5B6577" text-anchor="end">2026-08-19 · 발표덱 p29 · 현재 코드 기준</text>

  <!-- ===== 진입 (두 갈래) ===== -->
  <text x="60" y="194" font-size="17" font-weight="700" fill="#5B6577">진입 — 두 갈래</text>

  <!-- A. 아이가 묻는다 -->
  <g>
    <rect x="60" y="210" width="300" height="150" rx="18" fill="#FFFFFF" stroke="#001E5A" stroke-width="3"/>
    <text x="86" y="266" font-size="24" font-weight="800" fill="#001E5A">아이가 묻는다</text>
    <text x="86" y="308" font-size="18" fill="#1A2233">플로팅 버튼 · 추천 질문 칩</text>
  </g>

  <!-- B. 키웅이가 먼저 말 건다 -->
  <g>
    <rect x="60" y="390" width="300" height="160" rx="18" fill="#FFF5FA" stroke="#D70082" stroke-width="3"/>
    <text x="86" y="438" font-size="23" font-weight="800" fill="#D70082">키웅이가 먼저 말 건다</text>
    <text x="86" y="474" font-size="18" fill="#1A2233">매수 이탈 3회·체류 5분 감지</text>
    <rect x="86" y="496" width="196" height="34" rx="17" fill="#EDF0F5"/>
    <text x="184" y="519" font-size="16" font-weight="700" fill="#475066" text-anchor="middle">룰 감지 · LLM 미사용</text>
  </g>

  <!-- 진입 → 게이트 -->
  <path d="M360 285 L408 285" stroke="#001E5A" stroke-width="3" fill="none"/>
  <polygon points="408,278 408,292 420,285" fill="#001E5A"/>
  <path d="M360 470 L408 470" stroke="#D70082" stroke-width="3" fill="none"/>
  <polygon points="408,463 408,477 420,470" fill="#D70082"/>

  <!-- ===== ① 입력 안전 게이트 ===== -->
  <g>
    <rect x="418" y="210" width="320" height="340" rx="18" fill="#FFFFFF" stroke="#001E5A" stroke-width="3"/>
    <circle cx="454" cy="256" r="18" fill="#001E5A"/>
    <text x="454" y="263" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="482" y="264" font-size="25" font-weight="800" fill="#001E5A">입력 안전 게이트</text>
    <text x="444" y="318" font-size="19" fill="#1A2233">추천·예측·유해·개인정보를</text>
    <text x="444" y="356" font-size="19" fill="#1A2233">모델 도달 전에 고정 거절</text>
    <rect x="444" y="470" width="200" height="34" rx="17" fill="#EDF0F5"/>
    <text x="544" y="493" font-size="16" font-weight="700" fill="#475066" text-anchor="middle">LLM 미사용 · 룰 분류</text>
  </g>

  <!-- 게이트 → 라우팅 -->
  <path d="M738 380 L784 380" stroke="#001E5A" stroke-width="3" fill="none"/>
  <polygon points="784,373 784,387 796,380" fill="#001E5A"/>
  <rect x="740" y="340" width="54" height="26" rx="6" fill="#FFFFFF"/>
  <text x="767" y="359" font-size="17" font-weight="700" fill="#001E5A" text-anchor="middle">허용</text>

  <!-- ===== ② 답변 라우팅 ===== -->
  <g>
    <rect x="796" y="210" width="320" height="340" rx="18" fill="#FFFFFF" stroke="#001E5A" stroke-width="3"/>
    <circle cx="832" cy="256" r="18" fill="#001E5A"/>
    <text x="832" y="263" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="860" y="264" font-size="25" font-weight="800" fill="#001E5A">답변 라우팅</text>
    <text x="822" y="318" font-size="19" fill="#1A2233">사전·FAQ·데이터 조회 먼저,</text>
    <text x="822" y="356" font-size="19" fill="#1A2233">없을 때만 LLM이 답을 생성</text>
    <rect x="822" y="470" width="186" height="34" rx="17" fill="#6C2BD9"/>
    <text x="915" y="493" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM 조건부 호출</text>
  </g>

  <!-- 라우팅 → 검증 -->
  <path d="M1116 380 L1162 380" stroke="#001E5A" stroke-width="3" fill="none"/>
  <polygon points="1162,373 1162,387 1174,380" fill="#001E5A"/>

  <!-- ===== ③ 출력 2단 검증 ===== -->
  <g>
    <rect x="1174" y="210" width="320" height="340" rx="18" fill="#FFFFFF" stroke="#001E5A" stroke-width="3"/>
    <circle cx="1210" cy="256" r="18" fill="#001E5A"/>
    <text x="1210" y="263" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1238" y="264" font-size="25" font-weight="800" fill="#001E5A">출력 2단 검증</text>
    <text x="1200" y="318" font-size="19" fill="#1A2233">룰 필터 + AI 판정 2중 검사</text>
    <text x="1200" y="356" font-size="19" fill="#1A2233">우회 12/12 차단 · 오탐 0</text>
    <rect x="1200" y="470" width="160" height="34" rx="17" fill="#6C2BD9"/>
    <text x="1280" y="493" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM 판정 1회</text>
  </g>

  <!-- 검증 → DAPIE -->
  <path d="M1494 380 L1540 380" stroke="#001E5A" stroke-width="3" fill="none"/>
  <polygon points="1540,373 1540,387 1552,380" fill="#001E5A"/>
  <rect x="1490" y="340" width="58" height="26" rx="6" fill="#FFFFFF"/>
  <text x="1519" y="359" font-size="17" font-weight="700" fill="#001E5A" text-anchor="middle">통과</text>

  <!-- ===== ④ DAPIE 3단 응답 ===== -->
  <g>
    <rect x="1552" y="210" width="320" height="340" rx="18" fill="#FFFFFF" stroke="#001E5A" stroke-width="3"/>
    <circle cx="1588" cy="256" r="18" fill="#001E5A"/>
    <text x="1588" y="263" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1616" y="264" font-size="25" font-weight="800" fill="#001E5A">DAPIE 3단 응답</text>
    <text x="1578" y="318" font-size="19" fill="#1A2233">피드백 → 개념 하나 → 질문</text>
    <text x="1578" y="356" font-size="19" fill="#1A2233">정답 대신 더 쉬운 질문으로</text>
    <rect x="1578" y="470" width="176" height="34" rx="17" fill="#EDF0F5"/>
    <text x="1666" y="493" font-size="16" font-weight="700" fill="#475066" text-anchor="middle">추가 호출 없음</text>
  </g>

  <!-- DAPIE 되묻기 루프 -->
  <path d="M1640 550 L1640 606 L1800 606 L1800 560" stroke="#001E5A" stroke-width="2.5" fill="none"/>
  <polygon points="1793,562 1807,562 1800,550" fill="#001E5A"/>
  <text x="1712" y="646" font-size="18" font-weight="600" fill="#001E5A" text-anchor="middle">아이의 답 = 다음 턴 입력</text>

  <!-- ===== 차단 경로 ===== -->
  <path d="M578 550 L578 633" stroke="#D70082" stroke-width="3" fill="none"/>
  <polygon points="571,633 585,633 578,645" fill="#D70082"/>
  <text x="594" y="602" font-size="17" font-weight="700" fill="#D70082">차단</text>
  <path d="M1334 550 L1334 633" stroke="#D70082" stroke-width="3" fill="none"/>
  <polygon points="1327,633 1341,633 1334,645" fill="#D70082"/>
  <text x="1350" y="602" font-size="17" font-weight="700" fill="#D70082">차단</text>
  <g>
    <rect x="470" y="645" width="970" height="100" rx="16" fill="#D70082"/>
    <text x="955" y="688" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">차단 시 — 상황별 고정 안전 응답으로 대체</text>
    <text x="955" y="722" font-size="19" fill="#FFD9EC" text-anchor="middle">모델 원문은 화면에 직행하지 않는다 (닫힌 실패)</text>
  </g>

  <!-- ===== LLM 사용 지점 요약 ===== -->
  <g>
    <rect x="60" y="810" width="1812" height="76" rx="14" fill="#F5F1FF" stroke="#6C2BD9" stroke-width="2"/>
    <rect x="86" y="830" width="64" height="36" rx="10" fill="#6C2BD9"/>
    <text x="118" y="854" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">LLM</text>
    <text x="172" y="858" font-size="20" fill="#1A2233"><tspan font-weight="800" fill="#6C2BD9">LLM(GPT-5.6 Luna)은 보라색 두 구간에서만 돈다</tspan> — ② 조건부 생성(재작성·용어 분류·생성) + ③ 출력 판정 = 한 질문 최대 4회 · 전부 조건부 · 키는 서버 전용 · 실패 시 고정 폴백</text>
  </g>

  <!-- ===== 하단 공통 원칙 ===== -->
  <g>
    <rect x="60" y="920" width="1812" height="76" rx="14" fill="#001E5A"/>
    <text x="90" y="968" font-size="22" font-weight="700" fill="#FFFFFF">전 경로 공통 차단 — 종목 추천 · 매매 시점 · 목표가 · 수익률 전망</text>
    <text x="1842" y="968" font-size="16" fill="#C6D2EE" text-anchor="end">응답 구조 DAPIE (CHI 2023, KAIST) · 차단 실측: 우회 표현 12/12 · 오탐 0</text>
  </g>
</svg>
