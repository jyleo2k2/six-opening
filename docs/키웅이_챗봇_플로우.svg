<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="620" viewBox="0 0 1920 620" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="1920" height="620" fill="#FFFFFF"/>

  <!-- ===== 제목 ===== -->
  <text x="40" y="60" font-size="26" font-weight="800" fill="#001E5A">키웅이 챗봇 — 응답 파이프라인</text>
  <text x="40" y="90" font-size="15" fill="#5B6577">물어보면 답하고, 헤매면 먼저 돕는다 — 추천은 말버릇이 아니라 구조로 막는다</text>
  <text x="1880" y="60" font-size="12" fill="#5B6577" text-anchor="end">2026-08-19 · 발표덱 p29 · 현재 코드 기준</text>

  <!-- ===== 진입 (두 갈래) ===== -->
  <text x="40" y="140" font-size="13" font-weight="700" fill="#5B6577">진입 — 두 갈래</text>

  <!-- A. 아이가 묻는다 -->
  <g>
    <rect x="40" y="150" width="300" height="100" rx="16" fill="#FFFFFF" stroke="#001E5A" stroke-width="2.5"/>
    <text x="64" y="190" font-size="19" font-weight="800" fill="#001E5A">아이가 묻는다</text>
    <text x="64" y="222" font-size="14.5" fill="#1A2233">플로팅 버튼 · 화면별 추천 질문 칩</text>
  </g>

  <!-- B. 키웅이가 먼저 말 건다 -->
  <g>
    <rect x="40" y="270" width="300" height="100" rx="16" fill="#FFF5FA" stroke="#D70082" stroke-width="2.5"/>
    <text x="64" y="302" font-size="19" font-weight="800" fill="#D70082">키웅이가 먼저 말 건다</text>
    <text x="64" y="330" font-size="14.5" fill="#1A2233">매수 이탈 3회 · 화면 체류 5분 초과</text>
    <text x="64" y="354" font-size="12.5" fill="#5B6577">횟수·시간 룰 감지 · 창 강제 오픈 없음</text>
  </g>

  <!-- 진입 → 게이트 화살표 -->
  <path d="M340 200 L410 200" stroke="#001E5A" stroke-width="2.5" fill="none"/>
  <polygon points="410,194 410,206 420,200" fill="#001E5A"/>
  <path d="M340 320 L410 320" stroke="#D70082" stroke-width="2.5" fill="none"/>
  <polygon points="410,314 410,326 420,320" fill="#D70082"/>

  <!-- ===== ① 입력 안전 게이트 ===== -->
  <g>
    <rect x="420" y="150" width="320" height="220" rx="16" fill="#FFFFFF" stroke="#001E5A" stroke-width="2.5"/>
    <circle cx="450" cy="178" r="15" fill="#001E5A"/>
    <text x="450" y="184" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="474" y="184" font-size="19" font-weight="800" fill="#001E5A">입력 안전 게이트</text>
    <text x="446" y="224" font-size="14.5" fill="#1A2233">· 추천·예측 요구 → 고정 거절</text>
    <text x="446" y="254" font-size="14.5" fill="#1A2233">· 개인정보·유해·오프토픽 우회</text>
    <text x="446" y="284" font-size="14.5" fill="#1A2233">· 정서 위기 → 안전 종료·보호 안내</text>
    <text x="446" y="342" font-size="12.5" fill="#5B6577">9개 의도 분류 · 모델 호출 전에 차단</text>
  </g>

  <!-- 게이트 → 라우팅 -->
  <path d="M740 260 L790 260" stroke="#001E5A" stroke-width="2.5" fill="none"/>
  <polygon points="790,254 790,266 800,260" fill="#001E5A"/>
  <rect x="746" y="228" width="48" height="20" fill="#FFFFFF"/>
  <text x="770" y="243" font-size="13" font-weight="700" fill="#001E5A" text-anchor="middle">허용</text>

  <!-- ===== ② 답변 라우팅 ===== -->
  <g>
    <rect x="800" y="150" width="320" height="220" rx="16" fill="#FFFFFF" stroke="#001E5A" stroke-width="2.5"/>
    <circle cx="830" cy="178" r="15" fill="#001E5A"/>
    <text x="830" y="184" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="854" y="184" font-size="19" font-weight="800" fill="#001E5A">답변 라우팅</text>
    <text x="826" y="224" font-size="14.5" fill="#1A2233">· 용어 사전·FAQ 우선 (LLM 0회)</text>
    <text x="826" y="254" font-size="14.5" fill="#1A2233">· 종목·본인 기록 = 읽기 전용 조회</text>
    <text x="826" y="284" font-size="14.5" fill="#1A2233">· 그 외 허용 질문만 LLM 생성</text>
    <text x="826" y="342" font-size="12.5" fill="#5B6577">본인 데이터만 · 가족 기록 조회 없음</text>
  </g>

  <!-- 라우팅 → 검증 -->
  <path d="M1120 260 L1170 260" stroke="#001E5A" stroke-width="2.5" fill="none"/>
  <polygon points="1170,254 1170,266 1180,260" fill="#001E5A"/>

  <!-- ===== ③ 출력 2단 검증 ===== -->
  <g>
    <rect x="1180" y="150" width="320" height="220" rx="16" fill="#FFFFFF" stroke="#001E5A" stroke-width="2.5"/>
    <circle cx="1210" cy="178" r="15" fill="#001E5A"/>
    <text x="1210" y="184" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1234" y="184" font-size="19" font-weight="800" fill="#001E5A">출력 2단 검증</text>
    <text x="1206" y="224" font-size="14.5" fill="#1A2233">· 1단 정규식 룰 — 결정적 하한선</text>
    <text x="1206" y="254" font-size="14.5" fill="#1A2233">· 2단 AI 판정 — 우회 12/12 차단</text>
    <text x="1206" y="284" font-size="14.5" fill="#1A2233">· 실패·타임아웃 = 고정 응답</text>
    <text x="1206" y="342" font-size="12.5" fill="#5B6577">정상 설명 오탐 0 · 원문 직행 없음 (실측)</text>
  </g>

  <!-- 검증 → DAPIE -->
  <path d="M1500 260 L1550 260" stroke="#001E5A" stroke-width="2.5" fill="none"/>
  <polygon points="1550,254 1550,266 1560,260" fill="#001E5A"/>
  <rect x="1494" y="228" width="72" height="20" fill="#FFFFFF"/>
  <text x="1530" y="243" font-size="13" font-weight="700" fill="#001E5A" text-anchor="middle">통과분만</text>

  <!-- ===== ④ DAPIE 3단 응답 ===== -->
  <g>
    <rect x="1560" y="150" width="320" height="220" rx="16" fill="#FFFFFF" stroke="#001E5A" stroke-width="2.5"/>
    <circle cx="1590" cy="178" r="15" fill="#001E5A"/>
    <text x="1590" y="184" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1614" y="184" font-size="19" font-weight="800" fill="#001E5A">DAPIE 3단 응답</text>
    <text x="1586" y="224" font-size="14.5" fill="#1A2233">· 피드백 — 방금 행동을 짚는다</text>
    <text x="1586" y="254" font-size="14.5" fill="#1A2233">· 설명 — 한 턴에 개념 하나</text>
    <text x="1586" y="284" font-size="14.5" fill="#1A2233">· 질문으로 끝 — 틀리면 더 쉽게</text>
    <text x="1586" y="342" font-size="12.5" fill="#5B6577">정답을 주지 않는 게 구조로 강제된다</text>
  </g>

  <!-- DAPIE 되묻기 루프 -->
  <path d="M1630 370 L1630 404 L1810 404 L1810 380" stroke="#001E5A" stroke-width="2" fill="none"/>
  <polygon points="1804,382 1816,382 1810,372" fill="#001E5A"/>
  <text x="1720" y="428" font-size="13" fill="#001E5A" text-anchor="middle" font-weight="600">아이의 답이 다음 턴 입력 — 대화가 이어진다</text>

  <!-- ===== 차단 경로 ===== -->
  <path d="M580 370 L580 420" stroke="#D70082" stroke-width="2.5" fill="none"/>
  <polygon points="574,420 586,420 580,430" fill="#D70082"/>
  <text x="594" y="404" font-size="13" font-weight="700" fill="#D70082">차단</text>
  <path d="M1340 370 L1340 420" stroke="#D70082" stroke-width="2.5" fill="none"/>
  <polygon points="1334,420 1346,420 1340,430" fill="#D70082"/>
  <text x="1354" y="404" font-size="13" font-weight="700" fill="#D70082">차단</text>
  <g>
    <rect x="520" y="430" width="880" height="60" rx="14" fill="#D70082"/>
    <text x="960" y="467" font-size="16.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">차단 시 — 상황별 고정 안전 응답으로 대체 · 모델 원문은 화면에 직행하지 않는다 (닫힌 실패)</text>
  </g>

  <!-- ===== 하단 공통 원칙 ===== -->
  <g>
    <rect x="40" y="530" width="1840" height="44" rx="10" fill="#001E5A"/>
    <text x="64" y="558" font-size="16" font-weight="700" fill="#FFFFFF">전 경로 공통 차단 — 종목 추천 · 매매 시점 · 목표가 · 수익률 전망</text>
    <text x="1856" y="558" font-size="13" fill="#C6D2EE" text-anchor="end">응답 구조: DAPIE (CHI 2023, KAIST) · 차단 실측: 우회 표현 12/12 · 오탐 0</text>
  </g>
</svg>
