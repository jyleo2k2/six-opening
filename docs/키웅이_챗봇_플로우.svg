<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" font-family="Pretendard, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="1200" height="1400" fill="#F6F7FA"/>

  <text x="56" y="56" font-size="26" font-weight="700" fill="#001E5A">키웅이 챗봇 — 대화 처리 플로우</text>
  <text x="56" y="84" font-size="14" fill="#1A2233" opacity="0.7">F10 · 물어보면 답하고, 헤매면 먼저 돕는다 — 추천·예측은 구조적으로 거절한다</text>

  <!-- ============ A. 챗봇 진입 (decision) ============ -->
  <g>
    <polygon points="420,126 520,170 420,214 320,170" fill="#001E5A"/>
