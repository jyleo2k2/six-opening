<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영웅 키움 — LLM 운영 비용</title>
<style>
  /* 아키텍처_슬라이드.html과 같은 발표 덱 템플릿 실측값
     설계 캔버스 1440x810 / 배경 #FCFCFC / 좌측 여백 116
     머리말 #D70182 16px / 제목 #001E5A 35px bold
     카드 #F4F6FA / 강조 블록 #001E5A

     좌표는 템플릿 실측값 그대로 1440x810 로 잡고, 무대만 1920x1080 로 키운다
     (4/3 배). 덱 슬라이드 규격에 맞추면서 앞선 부록들과 눈금이 어긋나지 않는다.

     블록은 지표 이름과 수치 둘만 둔다 — 보조 설명 줄은 두지 않는다. */
  :root{
    --bg:#fcfcfc; --navy:#001e5a; --magenta:#d70182;
    --card:#f4f6fa; --muted:#6b7797;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--navy)}

  /* 인쇄 → PDF 로 뽑으면 도형/글자가 벡터로 남는다 (슬라이드 한 장 크기 그대로) */
  @page{size:1920px 1080px;margin:0}
  @media print{body{background:#fff}.stage{margin:0}}

  .stage{position:relative;width:1920px;height:1080px;margin:0 auto;overflow:hidden}
  .slide{position:absolute;left:0;top:0;width:1440px;height:810px;background:var(--bg);
         transform:scale(1.3333333);transform-origin:top left}

  .eyebrow{position:absolute;left:116px;top:73px;font-size:16px;font-weight:500;color:var(--magenta);letter-spacing:.01em}
  .title{position:absolute;left:116px;top:104px;margin:0;font-size:35px;font-weight:800;
         line-height:1.2;letter-spacing:-.02em;color:var(--navy)}
  .tagline{position:absolute;left:116px;top:157px;font-size:16px;font-weight:500;color:var(--muted)}
  .tagline b{color:var(--magenta);font-weight:700}

  /* ── 띠 머리: 네이비 강조 블록 ── */
  .band{position:absolute;left:116px;width:1208px;height:66px;background:var(--navy);border-radius:20px;
        display:flex;align-items:center;gap:14px;padding:0 28px;box-shadow:0 6px 18px rgba(0,30,90,.22)}
  .btag{font-size:13px;font-weight:700;letter-spacing:.08em;color:#8fa8e8}
  .bname{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.02em}

  /* ── 블록 카드: 지표 이름 + 수치 ── */
  .card{position:absolute;width:287px;height:160px;background:var(--card);border-radius:20px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
        padding:0 16px;text-align:center;box-shadow:0 4px 14px rgba(0,30,90,.06)}
  .card.solid{background:var(--navy);box-shadow:0 6px 18px rgba(0,30,90,.22)}

  .klab{font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
  .card.solid .klab{color:#8fa8e8}
  .big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .big.alert{color:var(--magenta)}
  .card.solid .big{color:#fff}
</style>
</head>
<body>
<div class="stage">
<div class="slide">
  <div class="eyebrow">부록</div>
  <h1 class="title">LLM 운영 비용</h1>
  <div class="tagline">gpt-5.6-luna · 입력 $0.20 / 출력 $1.20 per 1M 토큰 · <b>환율 1,400원 기준</b></div>

  <!-- ══ 01 · 챗봇 ══ -->
  <div class="band" style="top:208px">
    <span class="btag">01</span><span class="bname">챗봇 — 키웅이</span>
  </div>
  <div class="card" style="left:116px;top:292px">
    <div class="klab">게이트 처리</div>
    <div class="big">99.7%</div>
  </div>
  <div class="card" style="left:423px;top:292px">
    <div class="klab">사전 보강</div>
    <div class="big">13.8% → 0.3%</div>
  </div>
  <div class="card" style="left:730px;top:292px">
    <div class="klab">호출 단가</div>
    <div class="big">2~10원</div>
  </div>
  <div class="card solid" style="left:1037px;top:292px">
    <div class="klab">실질 비용</div>
    <div class="big">0.03원</div>
  </div>

  <!-- ══ 02 · 뉴스 파이프라인 ══ -->
  <div class="band" style="top:494px">
    <span class="btag">02</span><span class="bname">어린이 뉴스 파이프라인</span>
  </div>
  <div class="card" style="left:116px;top:578px">
    <div class="klab">호출 구조</div>
    <div class="big">4 역할 agent</div>
  </div>
  <div class="card" style="left:423px;top:578px">
    <div class="klab">1회 실행</div>
    <div class="big">최대 3만원</div>
  </div>
  <div class="card" style="left:730px;top:578px">
    <div class="klab">개선 여지</div>
    <div class="big alert">중복 제거</div>
  </div>
  <div class="card solid" style="left:1037px;top:578px">
    <div class="klab">월 비용</div>
    <div class="big">약 12만원</div>
  </div>
</div>
</div>
</body>
</html>
