<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영웅 키움 — 행동 신호 10초 임계값</title>
<style>
  /* 아키텍처_슬라이드.html·성향_스코어링_슬라이드.html과 같은 발표 덱 템플릿 실측값
     설계 캔버스 1440x810 / 배경 #FCFCFC / 좌측 여백 116
     eyebrow #D70182 16px / 제목 #001E5A 35px bold
     카드 #F4F6FA / 강조 블록 #001E5A

     좌표는 템플릿 실측값 그대로 1440x810 로 잡고, 무대만 1920x1080 로 키운다
     (4/3 배). 앞선 부록 슬라이드들과 눈금이 어긋나지 않는다.

     이 장은 카드 안 보조 설명(회색 작은 글씨)을 쓰지 않는다 — 말로 하는 자리다.
     그래서 카드 높이를 170 으로 잡고 두 줄을 헤더 아래 남는 세로 공간의
     한가운데에 둔다 (위 여백 76 = 아래 여백 76). */
  :root{
    --bg:#fcfcfc; --navy:#001e5a; --magenta:#d70182;
    --card:#f4f6fa; --muted:#6b7797; --arrow:#a3acc2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--navy)}

  /* 인쇄 → PDF 로 뽑으면 도형/글자가 벡터로 남는다 (슬라이드 한 장 크기 그대로) */
  @page{size:1920px 1080px;margin:0}
  @media print{body{background:#fff}.stage{margin:0}}

  .stage{position:relative;width:1920px;height:1080px;margin:0 auto;overflow:hidden}
  .slide{position:absolute;left:0;top:0;width:1440px;height:810px;background:var(--bg);
         transform:scale(1.3333333);transform-origin:top left}

  .eyebrow{position:absolute;left:116px;top:73px;font-size:16px;font-weight:500;color:var(--magenta);letter-spacing:.01em}
  .title{position:absolute;left:116px;top:104px;margin:0;font-size:35px;font-weight:800;
         line-height:1.2;letter-spacing:-.02em;color:var(--navy)}
  .tagline{position:absolute;left:116px;top:157px;font-size:16px;font-weight:500;color:var(--muted)}
  .tagline b{color:var(--magenta);font-weight:700}

  /* 블록 */
  .card{position:absolute;background:var(--card);border-radius:20px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
        box-shadow:0 4px 14px rgba(0,30,90,.06);text-align:center;padding:0 10px}
  .card.solid{background:var(--navy);box-shadow:0 6px 18px rgba(0,30,90,.22)}

  /* 섹션 라벨 — 템플릿의 네이비 필 */
  .chip{position:absolute;font-size:12px;font-weight:700;letter-spacing:.06em;
        background:var(--navy);color:#fff;border-radius:999px;padding:5px 14px}

  .ct{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .card.solid .ct{color:#fff}

  /* 태그 — 세는 자리는 네이비, 아직 검증 전인 값은 마젠타 */
  .tag{font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:999px;padding:3px 9px;
       background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,30,90,.08)}
  .tag.open{color:var(--magenta)}
  .card.solid .tag{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}

  /* 상수·산식은 숫자축이라 고정폭으로 둔다 */
  .fx{font-family:"Consolas","D2Coding",monospace;font-size:13px;font-weight:600;
      color:var(--navy);line-height:1.4}
  .card.solid .fx{color:#fff}

  /* 화살표 */
  .arw{position:absolute;height:2px;background:var(--navy)}
  .arw::after{content:"";position:absolute;top:-5px;width:0;height:0;
              border-top:6px solid transparent;border-bottom:6px solid transparent}
  .arw.r::after{right:-9px;border-left:11px solid var(--navy)}
</style>
</head>
<body>
<div class="stage">
<div class="slide">
  <div class="eyebrow">부록</div>
  <h1 class="title">행동 신호 왜 하필 10초로?</h1>
  <div class="tagline">10초는 <b>초기 운영값</b>이다 — 지금은 맞히는 대신 <b>잘못 세지 않는 것</b>에 걸었다</div>

  <!-- ── 무엇을 세는가 ── -->
  <div class="chip" style="left:116px;top:272px">HOW WE COUNT</div>
  <div class="card" style="left:116px;top:310px;width:230px;height:170px">
    <span class="tag">탭 3종</span>
    <div class="ct">기업정보 · 차트 · 뉴스</div>
  </div>
  <div class="arw r" style="left:354px;top:395px;width:26px"></div>
  <div class="card" style="left:388px;top:310px;width:230px;height:170px">
    <span class="tag">임계값</span>
    <div class="ct">10초 넘게 머문 열람만</div>
    <div class="fx">VALID_DWELL_MS = 10_000</div>
  </div>
  <div class="arw r" style="left:626px;top:395px;width:26px"></div>
  <div class="card" style="left:660px;top:310px;width:230px;height:170px">
    <span class="tag">시점</span>
    <div class="ct">매수 이전 열람만</div>
  </div>
  <div class="arw r" style="left:898px;top:395px;width:26px"></div>
  <div class="card" style="left:932px;top:310px;width:180px;height:170px">
    <span class="tag">판정</span>
    <div class="ct">3탭 중 2탭 이상</div>
    <div class="fx">EVIDENCE_TAB_MIN = 2</div>
  </div>
  <div class="arw r" style="left:1120px;top:395px;width:26px"></div>
  <div class="card solid" style="left:1154px;top:310px;width:170px;height:170px">
    <span class="tag">AXIS</span>
    <div class="ct">근거력</div>
  </div>

  <!-- ── 검증 계획 ── -->
  <div class="chip" style="left:116px;top:526px">NEXT — 검증하고 조정한다</div>
  <div class="card" style="left:116px;top:564px;width:381px;height:170px">
    <span class="tag open">1</span>
    <div class="ct">질문식 매매 기록과 맞춰 본다</div>
  </div>
  <div class="arw r" style="left:505px;top:649px;width:26px"></div>
  <div class="card" style="left:539px;top:564px;width:381px;height:170px">
    <span class="tag open">2</span>
    <div class="ct">어긋나는 자리가 답을 준다</div>
  </div>
  <div class="arw r" style="left:928px;top:649px;width:26px"></div>
  <div class="card solid" style="left:962px;top:564px;width:362px;height:170px">
    <div class="ct">정합성 확인 뒤 10초를 고친다</div>
  </div>
</div>
</div>
</body>
</html>
