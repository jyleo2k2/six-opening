<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F10 다피 카드 시뮬레이터</title>
<style>
  :root{--magenta:#e5007e;--navy:#1e2a4a;--bg:#f5f5fa;--ink:#1b1b2a}
  *{box-sizing:border-box}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  header{padding:18px 20px 6px;max-width:1100px;margin:0 auto}
  header h1{font-size:20px;margin:0 0 6px} header p{font-size:13px;color:#666;margin:2px 0}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;max-width:1100px;margin:0 auto;padding:14px 20px 40px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .picker{background:#fff;border:1px solid #e5e5ef;border-radius:14px;padding:14px;align-self:start;max-height:78vh;overflow-y:auto}
  .picker h3{font-size:13px;color:#7a5ca8;margin:12px 0 8px} .picker h3:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
  .chips button:hover{border-color:var(--magenta);color:var(--magenta)}
  .chips button.active{background:var(--magenta);border-color:var(--magenta);color:#fff;font-weight:700}
  .phone{background:#fff;border:1px solid #e5e5ef;border-radius:22px;max-width:450px;margin:0 auto;width:100%;display:flex;flex-direction:column;height:78vh;min-height:480px;overflow:hidden;transition:opacity .35s,transform .35s}
  .phone.closing{opacity:0;transform:translateY(40px)}
  .phone-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
  .phone-head b{font-size:14px}
  .phone-head button{border:0;background:none;color:#888;font-size:12.5px;cursor:pointer}
  .chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .bot{background:#f1f1f7;align-self:flex-start;border-bottom-left-radius:4px}
  .user{background:var(--magenta);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
  .prompt{font-size:12px;color:#666;align-self:flex-start;margin:-2px 0 0 4px}
  .cards{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start}
  .cards button{border:1px solid #d5d5e2;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
  .cards button:hover:not(:disabled){border-color:var(--magenta);color:var(--magenta)}
  .cards button:disabled{opacity:.45;cursor:default}
  .cards.answered button.picked{border-color:var(--magenta);color:var(--magenta);font-weight:700}
  .cards button.hint{box-shadow:0 0 0 2px #2fb46a inset;}
  .sys{align-self:center;font-size:12px;color:#888;background:#fff;border:1px dashed #ccc;border-radius:10px;padding:6px 12px;text-align:center}
  .empty{margin:auto;text-align:center;color:#999;font-size:13.5px;line-height:1.8}
  .toggle{font-size:12px;color:#555;display:flex;gap:6px;align-items:center;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>🐻 F10 다피(DAPIE) 카드 시뮬레이터</h1>
  <p>왼쪽에서 용어를 고르고, 실제 챗봇과 똑같이 선택지 카드를 눌러 흐름을 확인한다. 생성: 2026-08-15 · 기준 main <code>d41233e</code> · 승인 데이터를 실제 런타임 전이 함수로 전개한 스냅샷.</p>
  <p>규칙: 오답은 더 쉬운 설명(2문장, 질문은 그 설명에서 출제)으로, 작은 질문 오답은 예시로 <b>1회만</b> 재질문 후 정답 공개. “여기까지 볼래요”는 서버 호출 없이 시트를 닫는다.</p>
</header>
<div class="wrap">
  <aside class="picker" id="picker">
    <label class="toggle"><input type="checkbox" id="hint"> 정답 카드 힌트 표시(초록 테두리)</label>
  </aside>
  <main>
    <div class="phone" id="phone">
      <div class="phone-head"><b id="title">용어를 골라 주세요</b><button id="reset" type="button">처음부터</button></div>
      <div class="chat" id="chat"><div class="empty">👈 왼쪽 목록에서 용어를 고르면<br>다피 대화가 시작돼요</div></div>
    </div>
  </main>
</div>

const FOLLOWUP_IDS = new Set(["ask","done"]);
const chat = document.getElementById("chat");
const picker = document.getElementById("picker");
const titleEl = document.getElementById("title");
const phone = document.getElementById("phone");
const hintBox = document.getElementById("hint");
let current = null, stage = null, retried = false;

for (const group of ["금융 용어","차트 용어","화면 용어"]) {
  const items = DATA.filter(t => t.group === group);
  const h = document.createElement("h3");
  h.textContent = group + " (" + items.length + ")";
  picker.appendChild(h);
  const box = document.createElement("div");
  box.className = "chips";
  for (const t of items) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t.title; b.dataset.id = t.id;
    b.addEventListener("click", () => startTerm(t, b));
    box.appendChild(b);
  }
  picker.appendChild(box);
}

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  chat.appendChild(d);
}
function sys(text) {
  const d = document.createElement("div");
  d.className = "sys"; d.textContent = text;
  chat.appendChild(d);
}
function renderNode(node) {
  bubble("bot", node.text);
  if (node.end) { sys("대화가 끝났어요. 다른 용어를 골라 보세요."); return; }
  stage = node.stage;
  if (node.prompt) {
    const p = document.createElement("div");
    p.className = "prompt"; p.textContent = node.prompt;
    chat.appendChild(p);
  }
  const answerId = current.answers[stage];
  const cards = document.createElement("div");
  cards.className = "cards";
  for (const c of node.choices) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = c.label;
    if (hintBox.checked && c.id === answerId) b.classList.add("hint");
    b.addEventListener("click", () => pick(cards, b, c));
    cards.appendChild(b);
  }
  chat.appendChild(cards);
  chat.scrollTop = chat.scrollHeight;
}
function pick(cards, btn, choice) {
  cards.classList.add("answered");
  for (const b of cards.querySelectorAll("button")) b.disabled = true;
  btn.classList.add("picked");
  bubble("user", choice.label);

  if (stage === "followup" && choice.id === "done") {
    sys("챗봇 시트가 닫히고 원래 화면으로 돌아가요 (서버 호출 없음)");
    chat.scrollTop = chat.scrollHeight;
    phone.classList.add("closing");
    setTimeout(resetAll, 900);
    return;
  }
  let key = stage + ":" + choice.id;
  if (stage === "detail" && choice.id !== current.answers.detail) {
    if (retried) key += ":retry"; else retried = true;
  }
  const node = current.trans[key];
  if (!node) { sys("전이 없음: " + key); return; }
  renderNode(node);
}
function startTerm(term, chipBtn) {
  for (const b of picker.querySelectorAll("button")) b.classList.remove("active");
  chipBtn.classList.add("active");
  current = term; retried = false;
  titleEl.textContent = term.title;
  chat.innerHTML = "";
  renderNode(term.start);
}
function resetAll() {
  phone.classList.remove("closing");
  current = null; stage = null; retried = false;
  titleEl.textContent = "용어를 골라 주세요";
  chat.innerHTML = '<div class="empty">👈 왼쪽 목록에서 용어를 고르면<br>다피 대화가 시작돼요</div>';
  for (const b of picker.querySelectorAll("button")) b.classList.remove("active");
}
document.getElementById("reset").addEventListener("click", () => {
  if (current) { const t = current, chip = picker.querySelector('button[data-id="'+t.id+'"]'); startTerm(t, chip); }
});
</script>
