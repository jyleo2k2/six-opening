<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영웅 키움 — 시스템 아키텍처</title>
<style>
  :root{
    --ink:#1b1f2a; --muted:#8a90a0; --line:#dcdfe6;
    --navy:#153a8a; --blue:#1a56db; --gray-arrow:#b6bac4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#e9eaee;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}

  .slide{position:relative;width:1600px;height:900px;margin:24px auto;background:#f2f2f4;
         box-shadow:0 10px 40px rgba(20,30,60,.15);overflow:hidden}

  h1{position:absolute;top:36px;left:0;right:0;text-align:center;margin:0;
     font-size:42px;font-weight:800;letter-spacing:-.02em}

  .panel{position:absolute;background:#fff;border-radius:26px;box-shadow:0 2px 14px rgba(30,40,70,.07)}
  .card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:18px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
        box-shadow:0 1px 6px rgba(30,40,70,.05)}
  .card.plain{border:none;box-shadow:none}
  .card.dark{background:#153a8a;border-color:#153a8a;box-shadow:0 4px 16px rgba(21,58,138,.28)}
  .card > .title{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .card.dark > .title{color:#fff}

  .chip{position:absolute;font-size:13px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:5px 15px}
  .chip.fe,.chip.be,.chip.db{background:#dbeafe;color:#1d4ed8}
  .chip.ai{background:#ede9fe;color:#6d28d9}
  .chip.dep{background:#ffedd5;color:#c2410c}
  .chip.ext{background:#dcfce7;color:#15803d}

  .row{display:flex;gap:30px;align-items:flex-start;justify-content:center}
  .ic{width:90px;text-align:center}
  .ic img{height:56px;width:auto;max-width:80px;object-fit:contain;display:block;margin:0 auto 12px}
  .ic b{display:block;font-size:16px;font-weight:600;color:#3a4152;line-height:1.3}
  .card.dark .ic b{color:#dbe4ff}

  .arw{position:absolute;height:2px;background:var(--gray-arrow)}
  .arw::after{content:"";position:absolute;top:-5px;width:0;height:0;
              border-top:6px solid transparent;border-bottom:6px solid transparent}
  .arw.r::after{right:-9px;border-left:11px solid var(--gray-arrow)}
  .arw.l::after{left:-9px;border-right:11px solid var(--gray-arrow)}
  .arw.blue{background:var(--blue);height:3px}
  .arw.blue.r::after{border-left-color:var(--blue);top:-5.5px}
  .arw.blue.l::after{border-right-color:var(--blue);top:-5.5px}

  .varw{position:absolute;width:2px;background:var(--gray-arrow)}
  .varw::after{content:"";position:absolute;left:-5px;width:0;height:0;
               border-left:6px solid transparent;border-right:6px solid transparent}
  .varw.up::after{top:-9px;border-bottom:11px solid var(--gray-arrow)}
  .varw.dn::after{bottom:-9px;border-top:11px solid var(--gray-arrow)}
  .varw.blue{background:var(--blue);width:3px}
  .varw.blue.dn::after{border-top-color:var(--blue);left:-4.5px}
  .varw.blue.up::after{border-bottom-color:var(--blue);left:-4.5px}

  .lab{position:absolute;font-size:17px;line-height:1.45;color:#4b5162;font-weight:600;white-space:nowrap}
  .lab.blue{color:var(--blue)}
  .lab.c{text-align:center;transform:translateX(-50%)}
  .lab.rt{text-align:right}
</style>
</head>
<body>
<div class="slide">
  <h1>시스템 아키텍처</h1>

  <!-- ── 상단 패널: FRONTEND ⇄ BACKEND ⇄ AI ── -->
  <div class="panel" style="left:70px;top:135px;width:1180px;height:330px"></div>
  <div class="chip fe" style="left:104px;top:153px">FRONTEND</div>
  <div class="chip be" style="left:684px;top:147px">BACKEND</div>
  <div class="chip ai" style="left:1032px;top:153px">AI / LLM</div>

  <div class="card" style="left:100px;top:192px;width:430px;height:250px">
    <div class="title">화면 상태 관리 / 서버 API 호출</div>
    <div class="row">
      <div class="ic"><img src="https://cdn.simpleicons.org/react/61DAFB" alt=""><b>React</b></div>
      <div class="ic"><img src="https://cdn.simpleicons.org/typescript/3178C6" alt=""><b>TypeScript</b></div>
      <div class="ic"><img src="https://cdn.simpleicons.org/tailwindcss/06B6D4" alt=""><b>Tailwind</b></div>
    </div>
  </div>

  <div class="arw blue r" style="left:552px;top:272px;width:96px"></div>
  <div class="lab blue c" style="left:600px;top:240px">주문 · 조회 요청</div>
  <div class="arw l" style="left:552px;top:368px;width:96px"></div>
  <div class="lab c" style="left:600px;top:384px">화면 데이터 반환</div>

  <div class="card dark" style="left:670px;top:186px;width:220px;height:262px">
    <div class="title">API · 규칙 엔진</div>
    <div class="row" style="gap:14px">
      <div class="ic" style="width:84px"><img src="https://cdn.simpleicons.org/nextdotjs/FFFFFF" alt=""><b>Next.js</b></div>
      <div class="ic" style="width:84px"><img src="https://cdn.simpleicons.org/nodedotjs/8BD65F" alt=""><b>Node.js</b></div>
    </div>
  </div>

  <div class="arw blue r" style="left:912px;top:272px;width:86px"></div>
  <div class="lab blue c" style="left:955px;top:240px">질문 · 원문</div>
  <div class="arw l" style="left:912px;top:368px;width:86px"></div>
  <div class="lab c" style="left:955px;top:384px">답변 · 안전 필터</div>

  <div class="card" style="left:1020px;top:192px;width:190px;height:250px">
    <div class="title">키웅이 · 어린이 뉴스</div>
    <div class="row">
      <div class="ic" style="width:150px"><img src="https://svgl.app/library/openai.svg" alt=""><b>GPT-5.6 Luna</b></div>
    </div>
  </div>

  <!-- ── DEPLOYMENT ── -->
  <div class="arw blue r" style="left:1272px;top:300px;width:88px"></div>
  <div class="lab blue c" style="left:1316px;top:266px">배포</div>
  <div class="chip dep" style="left:1400px;top:170px">DEPLOYMENT</div>
  <div class="card" style="left:1390px;top:206px;width:170px;height:200px">
    <div class="row">
      <div class="ic" style="width:120px"><img src="https://cdn.simpleicons.org/railway/0B0D0E" alt=""><b>Railway</b></div>
    </div>
  </div>

  <!-- ── 상단 ⇄ DATABASE ── -->
  <div class="varw up" style="left:742px;top:472px;height:100px"></div>
  <div class="lab rt" style="left:502px;top:502px;width:220px">데이터 반환</div>
  <div class="varw blue dn" style="left:800px;top:472px;height:100px"></div>
  <div class="lab blue" style="left:822px;top:502px">조회 · 저장</div>

  <!-- ── 하단: EXTERNAL / DATABASE (같은 상단·높이) ── -->
  <div class="panel" style="left:150px;top:580px;width:360px;height:250px"></div>
  <div class="chip ext" style="left:184px;top:598px">EXTERNAL</div>
  <div class="card plain" style="left:180px;top:636px;width:300px;height:170px">
    <div class="title">시세 · 뉴스 원천</div>
    <div class="row">
      <div class="ic" style="width:110px"><img src="https://www.kiwoom.com/favicon.ico" alt=""><b>증권사 API</b></div>
      <div class="ic" style="width:110px"><img src="https://cdn.simpleicons.org/naver/03C75A" alt=""><b>네이버</b></div>
    </div>
  </div>

  <div class="arw r" style="left:524px;top:705px;width:60px"></div>

  <div class="panel" style="left:600px;top:580px;width:530px;height:250px"></div>
  <div class="chip db" style="left:634px;top:598px">DATABASE</div>
  <div class="card plain" style="left:630px;top:636px;width:470px;height:170px">
    <div class="title">데이터 관계 · 제약 조건 관리</div>
    <div class="row" style="gap:60px">
      <div class="ic" style="width:120px"><img src="https://cdn.simpleicons.org/supabase/3FCF8E" alt=""><b>Supabase</b></div>
      <div class="ic" style="width:120px"><img src="https://cdn.simpleicons.org/postgresql/4169E1" alt=""><b>PostgreSQL</b></div>
    </div>
  </div>
</div>
</body>
</html>
